version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: pecff-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-pecff}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pecff}
      POSTGRES_DB: ${POSTGRES_DB:-pecff}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pecff -d pecff"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7.2-alpine
    container_name: pecff-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  elasticsearch:
    image: elasticsearch:8.14.0
    container_name: pecff-elasticsearch
    restart: unless-stopped
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    ports:
      - "9200:9200"
    volumes:
      - es_data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:9200/_cluster/health | grep -q '\"status\":\"green\"\\|\"status\":\"yellow\"'"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:RELEASE.2024-06-13T22-53-53Z
    container_name: pecff-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pecff-api
    restart: unless-stopped
    command: uvicorn pecff.api.main:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    environment:
      - PECFF_DATABASE_URL=postgresql+asyncpg://pecff:pecff@postgres:5432/pecff
      - PECFF_SYNC_DATABASE_URL=postgresql://pecff:pecff@postgres:5432/pecff
      - PECFF_REDIS_URL=redis://redis:6379/0
      - PECFF_ELASTICSEARCH_URL=http://elasticsearch:9200
      - PECFF_MINIO_ENDPOINT=minio:9000
      - PECFF_MINIO_ACCESS_KEY=minioadmin
      - PECFF_MINIO_SECRET_KEY=minioadmin
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
      minio:
        condition: service_healthy

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pecff-worker
    restart: unless-stopped
    command: celery -A pecff.api.worker.celery_app worker --loglevel=info --concurrency=4
    environment:
      - PECFF_DATABASE_URL=postgresql+asyncpg://pecff:pecff@postgres:5432/pecff
      - PECFF_SYNC_DATABASE_URL=postgresql://pecff:pecff@postgres:5432/pecff
      - PECFF_REDIS_URL=redis://redis:6379/0
      - PECFF_ELASTICSEARCH_URL=http://elasticsearch:9200
      - PECFF_MINIO_ENDPOINT=minio:9000
      - PECFF_MINIO_ACCESS_KEY=minioadmin
      - PECFF_MINIO_SECRET_KEY=minioadmin
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
  es_data:
  minio_data:
