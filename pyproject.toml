[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pecff"
version = "0.1.0"
description = "Passive Email Cryptographic Forensics Framework (PECFF)"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
authors = [
    { name = "PECFF Core Team" }
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security :: Cryptography",
    "Topic :: System :: Networking :: Monitoring",
]
dependencies = [
    "dpkt>=1.9.8",
    "python-pcapng>=2.1.1",
    "cryptography>=43.0.0",
    "asn1crypto>=1.5.1",
    "scikit-learn>=1.5.0",
    "pandas>=2.2.0",
    "pyarrow>=17.0.0",
    "numpy>=1.26.0",
    "fastapi>=0.112.0",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
    "pyjwt>=2.8.0",
    "uvicorn>=0.30.0",
    "python-multipart>=0.0.9",
    "celery>=5.4.0",
    "redis>=5.0.0",
    "sqlalchemy>=2.0.30",
    "greenlet>=3.0.0",
    "asyncpg>=0.29.0",
    "alembic>=1.13.0",
    "elasticsearch>=8.14.0",
    "minio>=7.2.0",
    "reportlab>=4.2.0",
    "jinja2>=3.1.4",
    "pyyaml>=6.0.0",
    "certifi>=2024.0.0",
    "oscrypto @ git+https://github.com/wbond/oscrypto.git@d5f3437ed24257895ae1edd9e503cfb352e635a8",
    "certvalidator>=0.11.1",
    "click>=8.1.7",
    "rich>=13.7.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "hypothesis>=6.100.0",
    "httpx>=0.27.0",
    "scapy>=2.5.0",
    "mypy>=1.11.0",
    "ruff>=0.5.0",
    "types-reportlab>=4.2.0",
    "types-pyyaml>=6.0.0",
    "types-certifi>=2021.10.8",
]
pdf_full = [
    "weasyprint>=62.0",
]

[project.scripts]
pecff = "pecff.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.mypy]
python_version = "3.12"
strict = true
disallow_any_generics = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_return_any = true
warn_unreachable = true

[[tool.mypy.overrides]]
module = [
    "dpkt.*",
    "pcapng.*",
    "asn1crypto.*",
    "certvalidator.*",
    "oscrypto.*",
    "certifi.*",
    "reportlab.*",
    "weasyprint.*",
    "scapy.*",
    "minio.*",
    "celery.*",
    "kombu.*",
    "elasticsearch.*",
    "pandas.*",
    "pyarrow.*",
    "sklearn.*",
    "skops.*",
    "stix2.*",
    "jsonschema.*",
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "pecff.tasks.*"
disallow_untyped_decorators = false


[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
]
ignore = ["E501", "N818", "B008"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
python_files = ["test_*.py"]
asyncio_mode = "auto"
markers = [
    "slow: marks tests as slow benchmark (deselect with '-m \"not slow\"')",
]
