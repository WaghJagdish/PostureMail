services:
  - type: web
    name: posturemail-api
    runtime: python
    buildCommand: pip install --upgrade pip && pip install "oscrypto @ git+https://github.com/wbond/oscrypto.git@d5f3437ed24257895ae1edd9e503cfb352e635a8" && pip install -e . && python scripts/patch_oscrypto.py
    startCommand: uvicorn pecff.api.app:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PECFF_PROTOTYPE_MODE
        value: "true"
      - key: PECFF_DATABASE_URL
        sync: false
      - key: PECFF_SYNC_DATABASE_URL
        sync: false
      - key: PECFF_REDIS_URL
        sync: false
      - key: PECFF_SECRET_KEY
        sync: false
      - key: PYTHON_VERSION
        value: "3.12.0"
    autoDeploy: true

  - type: web
    name: posturemail-frontend-fixed
    runtime: static
    buildCommand: cd frontend && npm ci && npm run build
    staticPublishPath: ./frontend/dist
    envVars:
      - key: VITE_API_BASE
        value: https://posturemail-api.onrender.com
    autoDeploy: true
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
